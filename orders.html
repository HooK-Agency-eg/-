<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orders and invoices | Hook</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css"></head><body>
<main>
<section class="phero"><div class="wrap"><span class="script" data-ar="الإدارة">Admin</span><h1 data-ar="الطلبات والفواتير">Orders and invoices</h1></div></section>
<section style="padding-top:20px"><div class="wrap" id="dash"><p>…</p></div></section>
</main><script src="config.js"></script><script src="seed.js"></script><script src="app.js"></script><script src="admin-ui.js"></script>
<script>

let FS='all',FQ='';
function ordersTable(){
  const man=can('orders.manage'),q=FQ.trim().toLowerCase();
  const list=ST.orders.filter(o=>(FS==='all'||o.status===FS)&&(!q||JSON.stringify([o.user,o.extra,o.items.map(i=>i.name+i.sku)]).toLowerCase().includes(q)));
  $('otab').innerHTML=list.length?tbl([t('Order','الطلب'),t('Date','التاريخ'),t('Customer','العميل'),t('Items','العناصر'),t('Amounts','المبالغ'),t('Status','الحالة'),''],list.map(o=>{const x=o.extra||{},sh=x.ship,paid=+x.paid||0,conf=o.status==='confirmed'||o.status==='done';
    return '<tr><td dir="ltr"><b>'+esc(x.inv||'-')+'</b></td><td>'+esc(day(o.at))+'</td><td>'+esc(o.user||t('Guest','زائر'))+(sh?'<br><small>'+esc(sh.name)+' · <span dir="ltr">'+esc(sh.phone)+'</span><br>'+esc(L(sh.regionName))+' - '+esc(sh.address)+'</small>':'')+(x.email?'<br><small dir="ltr">'+esc(x.email)+'</small>':'')+'</td>'
     +'<td>'+o.items.map(i=>esc(i.name)+(i.sku?' <small dir="ltr">['+esc(i.sku)+']</small>':'')+' '+esc(lineTxt(i)||'')).join('<br>')+'</td>'
     +'<td><b>'+fm(o.total)+' '+cur()+'</b>'+(x.coupon?'<br><small>'+t('coupon ','كوبون ')+'<span dir="ltr">'+esc(x.coupon.code)+'</span> -'+fm(x.discount)+'</small>':'')+(sh?'<br><small>'+t('shipping ','شحن ')+fm(sh.fee)+'</small>':'')+(conf?'<br><small>'+t('paid ','مدفوع ')+fm(paid)+' · '+t('remaining ','متبقي ')+'<b>'+fm(o.total-paid)+'</b></small>':'')+'</td>'
     +'<td>'+(man?'<select data-ord="'+esc(o.id)+'">'+Object.keys(ORD).map(k=>'<option value="'+k+'"'+(k==o.status?' selected':'')+'>'+t(...ORD[k])+'</option>').join('')+'</select>':'<span class="badge">'+t(...ORD[o.status])+'</span>')+'</td>'
     +'<td class="nw">'+(man&&conf?'<button class="btn ghost sm" data-pay="'+esc(o.id)+'">'+t('Payment','الدفع')+'</button> ':'')+'<button class="btn ghost sm" data-pdf="'+esc(o.id)+'">PDF</button></td></tr>'})):empty('No orders match.','مفيش طلبات مطابقة.');
}
adminPage('orders.view',body=>{
  const n=k=>ST.orders.filter(o=>o.status===k).length;
  body.innerHTML='<div class="kpis">'+kpi(ST.orders.length,'Orders','الطلبات')+Object.keys(ORD).map(k=>kpi(n(k),ORD[k][0][0].toUpperCase()+ORD[k][0].slice(1),ORD[k][1])).join('')+'</div>'
   +'<div class="card" style="margin-top:20px"><div class="oh" style="margin-bottom:12px"><h3 style="margin:0">'+t('Orders and invoices','الطلبات والفواتير')+'</h3><select id="ofs" style="width:auto;margin-inline-start:auto"><option value="all">'+t('All statuses','كل الحالات')+'</option>'+Object.keys(ORD).map(k=>'<option value="'+k+'"'+(k==FS?' selected':'')+'>'+t(...ORD[k])+'</option>').join('')+'</select><input id="oq" placeholder="'+t('Search name, phone, invoice...','دوّر بالاسم أو التليفون أو الفاتورة...')+'" value="'+esc(FQ)+'" style="width:240px"></div>'
   +(can('orders.manage')?'<p style="opacity:.8;font-size:.92rem;margin-bottom:10px">'+t('When you choose "confirmed" you write what the customer paid; then the customer gets an email with the confirmation, the paid and remaining amounts and the invoice. Nothing is emailed when the order is placed.','لما تختار "مؤكد" بتكتب العميل دفع كام، وبعدها العميل بيوصله إيميل بتأكيد الطلب والمدفوع والمتبقي والفاتورة. مفيش أي إيميل بيتبعت لما الطلب بيتعمل.')+'</p>':'')+'<div id="otab"></div></div>';
  ordersTable();$('ofs').onchange=e=>{FS=e.target.value;ordersTable()};$('oq').oninput=e=>{FQ=e.target.value;ordersTable()};
});
document.addEventListener('change',async e=>{
  const sel=e.target.closest('select[data-ord]');if(!sel)return;const o=ST.orders.find(x=>x.id===sel.dataset.ord),v=sel.value;
  if(v==='confirmed')return payDialog(o,true,ok=>{ok?afterSave():redraw()});
  if(v==='cancelled'&&!confirm(t('Cancel this order? The stock and the coupon use go back.','تلغي الطلب ده؟ المخزون واستخدام الكوبون هيرجعوا.'))){redraw();return}
  const r=await api('/api/admin/orders/'+o.id,'PATCH',{status:v});if(r.ok)afterSave();else{alert(errT(r.j.error||'Error'));redraw()}
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pdf)invoicePdf(ST.orders.find(o=>o.id===b.dataset.pdf),b);
  if(b.dataset.pay)payDialog(ST.orders.find(o=>o.id===b.dataset.pay),false,ok=>{if(ok)afterSave()});
});

</script></body></html>
